{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='images/bot_logo.png') }}" alt="VisaWin Logo" style="width: 72px; height: 72px; border-radius: 14px; margin-bottom: 12px; object-fit: contain; background: transparent; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));">
            <h2 style="font-size: 22px; font-weight: 700; color: var(--text-primary); margin: 0;">VisaWin</h2>
            <p style="color: var(--accent-gold); font-size: 13px; font-weight: 600; margin-top: 4px;">You dream. We monitor. You move.</p>
        </div>


        <form action="{{ url_for('login') }}" method="POST" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Login to Hub ➔
            </button>
        </form>

        <div class="login-footer">
            <small>Default: <code>admin</code> / <code>admin123</code> (Configurable in .env)</small>
        </div>
    </div>
</div>
{% endblock %}
